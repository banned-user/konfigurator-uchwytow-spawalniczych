<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Konfigurator Uchwyty Spawalnicze</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --accent: #ff6b00;
  --accent2: #00c2a8;
  --text: #e8eef5;
  --muted: #8b9bb4;
  --border: #2a3a50;
  --success: #22c55e;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  line-height: 1.4;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.6rem; margin-bottom: 4px; color: var(--accent); }
.subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
.progress { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.progress .step {
  flex: 1; min-width: 60px; text-align: center; padding: 6px 4px;
  background: var(--card); border-radius: 6px; font-size: 0.75rem; color: var(--muted);
  border: 1px solid var(--border);
}
.progress .step.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
.progress .step.done { background: #1e3a2f; color: var(--success); }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.option {
  background: #111820;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 70px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.option:hover { border-color: var(--accent2); }
.option.selected { border-color: var(--accent); background: #2a1a10; }
.option .name { font-weight: 600; font-size: 1.05rem; }
.option .price { color: var(--accent2); font-size: 0.85rem; margin-top: 4px; }
.option .desc { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
.nav { display: flex; gap: 12px; margin-top: 20px; }
button {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 14px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  flex: 1;
}
button.secondary { background: #2a3a50; color: var(--text); }
button.success { background: var(--success); color: #000; }
button.danger { background: var(--danger); color: #fff; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.summary { font-size: 1.05rem; }
.summary .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.summary .total { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-top: 12px; }
.product-code {
  background: #000;
  color: var(--accent2);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 1.15rem;
  padding: 16px;
  border-radius: 8px;
  margin: 16px 0;
  word-break: break-all;
  border: 1px dashed var(--accent2);
}
.orders-list .order {
  background: #111820;
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 0 8px 8px 0;
}
.orders-list .order .code { font-family: ui-monospace, monospace; color: var(--accent2); font-size: 1.1rem; }
.orders-list .order .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar button { flex: none; padding: 10px 16px; font-size: 0.9rem; }
.hidden { display: none !important; }
#app { display: none; }
#app.active { display: block; }
.header-actions { display: flex; gap: 8px; margin-bottom: 12px; }
@media (max-width: 600px) {
  .options { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div class="container">
  <div style="background:#1a2332;padding:10px 12px;border-radius:8px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <span style="font-size:0.9rem;color:var(--muted)">Synchronizacja:</span>
    <input type="text" id="syncUrl" placeholder="Wklej URL z Apps Script (kończy się na /exec)" style="flex:1;min-width:200px;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);font-size:0.9rem">
    <button class="secondary" style="flex:none;padding:8px 14px;font-size:0.9rem" onclick="saveSyncUrl()">Zapisz URL</button>
    <button class="secondary" style="flex:none;padding:8px 14px;font-size:0.9rem" onclick="loadFromCloud()">Odśwież z chmury</button>
    <span id="syncStatus" style="font-size:0.85rem;color:var(--accent2)"></span>
  </div>

  <div class="header-actions">
    <button class="secondary" onclick="showSection('config')">Konfigurator</button>
    <button class="secondary" onclick="showOrders('todo')">Do realizacji (<span id="countTodo">0</span>)</button>
    <button class="secondary" onclick="showOrders('waiting')">W oczekiwaniu (<span id="countWaiting">0</span>)</button>
    <button class="secondary" onclick="showOrders('done')">Zrealizowane (<span id="countDone">0</span>)</button>
    <button class="secondary" onclick="document.getElementById('fileInput').click()">Wczytaj bazę (JSON)</button>
    <button class="secondary" onclick="exportData()">Eksportuj bazę</button>
    <button class="secondary" onclick="exportOrders()">Eksportuj zamówienia</button>
    <button class="secondary" onclick="document.getElementById('ordersFileInput').click()">Importuj zamówienia</button>
    <input type="file" id="ordersFileInput" accept=".json" style="display:none" onchange="importOrdersFile(this)">
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadDataFile(this)">
  </div>

  <div id="section-config" class="section">
    <h1>Konfigurator uchwytów spawalniczych</h1>
    <p class="subtitle">Wybierz krok po kroku – gotowy kod do realizacji na końcu</p>
    <div class="progress" id="progress"></div>
    <div class="card" id="stepContent"></div>
    <div class="nav">
      <button class="secondary" id="btnBack" onclick="prevStep()" disabled>Wstecz</button>
      <button id="btnNext" onclick="nextStep()" disabled>Dalej</button>
    </div>
  </div>

  <div id="section-orders" class="section hidden">
    <h1 id="ordersTitle">Do realizacji</h1>
    <p class="subtitle" id="ordersSubtitle">Gotowe konfiguracje</p>
    <div class="toolbar">
      <button class="danger" onclick="clearCurrentOrders()">Wyczyść bieżącą listę</button>
    </div>
    <div id="ordersList" class="orders-list"></div>
  </div>
</div>

<script>
const STEPS = [
  { id: 'cooling', title: 'Typ uchwytu' },
  { id: 'neck', title: 'Fajka' },
  { id: 'size', title: 'Rozmiar SR' },
  { id: 'length', title: 'Długość' },
  { id: 'cover', title: 'Osłona' },
  { id: 'coverColor', title: 'Kolor osłony' },
  { id: 'leather', title: 'Skóra' },
  { id: 'leatherColor', title: 'Kolor skóry' },
  { id: 'machine', title: 'Maszyna' },
  { id: 'summary', title: 'Podsumowanie' }
];

let data = null;
let currentStep = 0;
let config = {};
let orders = JSON.parse(localStorage.getItem('weldingOrders') || '[]');
let currentOrdersView = 'todo';
let syncUrl = localStorage.getItem('weldingSyncUrl') || '';

function saveSyncUrl() {
  syncUrl = document.getElementById('syncUrl').value.trim();
  localStorage.setItem('weldingSyncUrl', syncUrl);
  document.getElementById('syncStatus').textContent = syncUrl ? 'URL zapisany' : 'URL usunięty';
  if (syncUrl) loadFromCloud();
}

async function loadFromCloud() {
  if (!syncUrl) {
    document.getElementById('syncStatus').textContent = 'Brak URL synchronizacji';
    return;
  }
  document.getElementById('syncStatus').textContent = 'Ładowanie...';
  try {
    const res = await fetch(syncUrl + (syncUrl.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const loaded = await res.json();
    if (Array.isArray(loaded)) {
      orders = loaded;
      localStorage.setItem('weldingOrders', JSON.stringify(orders));
      updateOrdersCount();
      if (!document.getElementById('section-orders').classList.contains('hidden')) renderOrders();
      document.getElementById('syncStatus').textContent = 'Zsynchronizowano (' + orders.length + ')';
    } else {
      throw new Error('Niepoprawny format danych');
    }
  } catch (err) {
    document.getElementById('syncStatus').textContent = 'Błąd odczytu: ' + err.message;
    console.error(err);
  }
}

async function saveToCloud() {
  if (!syncUrl) return;
  document.getElementById('syncStatus').textContent = 'Zapisywanie...';
  try {
    await fetch(syncUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(orders)
    });
    document.getElementById('syncStatus').textContent = 'Zapisano w chmurze';
  } catch (err) {
    document.getElementById('syncStatus').textContent = 'Błąd zapisu: ' + err.message;
    console.error(err);
  }
}

const DEFAULT_DATA = {
  "basePrice": 150,
  "currency": "zł",
  "coolingTypes": [
    { "id": "gazowy", "name": "Gazowy (powietrzny)", "description": "Chłodzenie gazem", "sizes": ["SR9", "SR17", "SR26"] },
    { "id": "wodny", "name": "Wodny", "description": "Chłodzenie wodą", "sizes": ["SR18", "SR20"] }
  ],
  "neckTypes": [
    { "id": "flex", "name": "Flex", "price": 25, "code": "Flex" },
    { "id": "sztywny", "name": "Sztywny", "price": 0, "code": "" }
  ],
  "sizes": {
    "SR9": { "name": "SR 9", "price": 90, "amperage": "do ~110A" },
    "SR17": { "name": "SR 17", "price": 110, "amperage": "do ~140A" },
    "SR26": { "name": "SR 26", "price": 140, "amperage": "do ~180A" },
    "SR18": { "name": "SR 18", "price": 220, "amperage": "do ~320A" },
    "SR20": { "name": "SR 20", "price": 190, "amperage": "do ~220A" }
  },
  "lengths": [
    { "m": 4, "price": 45 }, { "m": 6, "price": 65 }, { "m": 8, "price": 85 },
    { "m": 10, "price": 105 }, { "m": 12, "price": 125 }, { "m": 14, "price": 145 }, { "m": 16, "price": 165 }
  ],
  "covers": [
    { "id": "guma", "name": "Guma", "pricePerMeter": 4.5, "code": "Sguma" },
    { "id": "tekstyl", "name": "Tekstyl", "pricePerMeter": 2.8, "code": "Stekstyl" }
  ],
  "coverColors": ["szary", "czarny", "granatowy", "czerwony", "pomarańczowy"],
  "leathers": [
    { "id": "natural", "name": "Naturalna", "price": 55, "code": "natural" },
    { "id": "syntetyk", "name": "Syntetyczna", "price": 32, "code": "syntetyk" },
    { "id": "brak", "name": "Bez skóry", "price": 0, "code": "brak" }
  ],
  "leatherColors": ["czarna", "brązowa", "szara", "beżowa", "czerwona"],
  "machines": [
    { "id": "kemppi7pin", "name": "Kemppi 7pin", "price": 38, "code": "kemppi 7pin" },
    { "id": "kemppi5pin", "name": "Kemppi 5pin", "price": 38, "code": "kemppi 5pin" },
    { "id": "fronius", "name": "Fronius", "price": 45, "code": "fronius" },
    { "id": "esab", "name": "ESAB", "price": 40, "code": "esab" },
    { "id": "lincoln", "name": "Lincoln", "price": 40, "code": "lincoln" },
    { "id": "migatronic", "name": "Migatronic", "price": 42, "code": "migatronic" },
    { "id": "ewm", "name": "EWM", "price": 40, "code": "ewm" },
    { "id": "uniwersalna", "name": "Uniwersalna / inna", "price": 25, "code": "uniwersalna" }
  ]
};

function removeOrder(id) {
  orders = orders.filter(o => o.id !== id);
  localStorage.setItem('weldingOrders', JSON.stringify(orders));
  updateOrdersCount();
  renderOrders();
  saveToCloud();
}

function init() {
  data = JSON.parse(localStorage.getItem('weldingData') || 'null') || DEFAULT_DATA;
  orders.forEach(o => {
    if (!o.status) o.status = 'todo';
  });
  document.getElementById('syncUrl').value = syncUrl;
  if (syncUrl) loadFromCloud();
  updateOrdersCount();
  renderProgress();
  renderStep();
  document.getElementById('section-config').classList.add('active');
}

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  document.getElementById('section-' + name).classList.remove('hidden');
  if (name === 'orders') renderOrders();
}

function showOrders(view) {
  currentOrdersView = view;
  showSection('orders');
  const titles = {
    todo: 'Do realizacji',
    waiting: 'W oczekiwaniu',
    done: 'Zrealizowane'
  };
  const subtitles = {
    todo: 'Gotowe do produkcji',
    waiting: 'Oczekujące na potwierdzenie / materiały',
    done: 'Zrealizowane zamówienia'
  };
  document.getElementById('ordersTitle').textContent = titles[view] || 'Zamówienia';
  document.getElementById('ordersSubtitle').textContent = subtitles[view] || '';
  renderOrders();
}

function updateOrdersCount() {
  const todo = orders.filter(o => o.status === 'todo').length;
  const waiting = orders.filter(o => o.status === 'waiting').length;
  const done = orders.filter(o => o.status === 'done').length;
  document.getElementById('countTodo').textContent = todo;
  document.getElementById('countWaiting').textContent = waiting;
  document.getElementById('countDone').textContent = done;
}

function renderProgress() {
  const el = document.getElementById('progress');
  el.innerHTML = STEPS.map((s, i) =>
    `<div class="step ${i === currentStep ? 'active' : ''} ${i < currentStep ? 'done' : ''}">${s.title}</div>`
  ).join('');
}

function renderStep() {
  const step = STEPS[currentStep];
  const content = document.getElementById('stepContent');
  const btnNext = document.getElementById('btnNext');
  const btnBack = document.getElementById('btnBack');
  btnBack.disabled = currentStep === 0;
  btnNext.disabled = !isStepComplete();
  btnNext.textContent = currentStep === STEPS.length - 1 ? 'Podsumowanie' : 'Dalej';
  if (currentStep === STEPS.length - 1) {
    btnNext.style.display = 'none';
  } else {
    btnNext.style.display = '';
  }

  if (step.id === 'summary') {
    renderSummary(content);
    return;
  }

  let html = `<h2 style="margin-bottom:16px">${step.title}</h2>`;
  html += '<div class="options">';

  if (step.id === 'cooling') {
    data.coolingTypes.forEach(t => {
      html += optionHTML(t.id, t.name, t.description || '', config.cooling === t.id);
    });
  } else if (step.id === 'neck') {
    data.neckTypes.forEach(t => {
      html += optionHTML(t.id, t.name, `+${t.price} ${data.currency}`, config.neck === t.id);
    });
  } else if (step.id === 'size') {
    const allowed = data.coolingTypes.find(c => c.id === config.cooling)?.sizes || [];
    allowed.forEach(sid => {
      const s = data.sizes[sid];
      if (s) html += optionHTML(sid, s.name, `${s.amperage || ''} · +${s.price} ${data.currency}`, config.size === sid);
    });
  } else if (step.id === 'length') {
    data.lengths.forEach(l => {
      html += optionHTML(l.m, `${l.m} m`, `+${l.price} ${data.currency}`, config.length === l.m);
    });
  } else if (step.id === 'cover') {
    data.covers.forEach(c => {
      const ppm = c.pricePerMeter || c.price || 0;
      html += optionHTML(c.id, c.name, `${ppm} ${data.currency}/m`, config.cover === c.id);
    });
  } else if (step.id === 'coverColor') {
    data.coverColors.forEach(col => {
      html += optionHTML(col, col.charAt(0).toUpperCase() + col.slice(1), '', config.coverColor === col);
    });
  } else if (step.id === 'leather') {
    data.leathers.forEach(l => {
      html += optionHTML(l.id, l.name, `+${l.price} ${data.currency}`, config.leather === l.id);
    });
  } else if (step.id === 'leatherColor') {
    if (config.leather === 'brak') {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Brak skóry – pomijamy kolor</p>';
      config.leatherColor = '';
    } else {
      data.leatherColors.forEach(col => {
        html += optionHTML(col, col.charAt(0).toUpperCase() + col.slice(1), '', config.leatherColor === col);
      });
    }
  } else if (step.id === 'machine') {
    data.machines.forEach(m => {
      html += optionHTML(m.id, m.name, `+${m.price} ${data.currency}`, config.machine === m.id);
    });
  }

  html += '</div>';
  content.innerHTML = html;

  content.querySelectorAll('.option').forEach(el => {
    el.onclick = () => selectOption(step.id, el.dataset.id);
  });
}

function optionHTML(id, name, extra, selected) {
  return `<div class="option ${selected ? 'selected' : ''}" data-id="${id}">
    <div class="name">${name}</div>
    ${extra ? `<div class="price">${extra}</div>` : ''}
  </div>`;
}

function selectOption(stepId, value) {
  if (stepId === 'length') value = Number(value);
  config[stepId] = value;
  if (stepId === 'leather' && value === 'brak') config.leatherColor = '';
  renderStep();
  document.getElementById('btnNext').disabled = !isStepComplete();
}

function isStepComplete() {
  const step = STEPS[currentStep].id;
  if (step === 'summary') return true;
  if (step === 'leatherColor' && config.leather === 'brak') return true;
  return config[step] !== undefined && config[step] !== '';
}

function nextStep() {
  if (currentStep === STEPS.length - 1) {
    return;
  }
  if (!isStepComplete()) return;
  currentStep++;
  renderProgress();
  renderStep();
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderProgress();
    renderStep();
  }
}

function getCoverMeters() {
  if (!config.length) return 0;
  return config.leather === 'brak' ? config.length : Math.max(0, config.length - 1);
}

function calculatePrice() {
  let total = data.basePrice || 0;
  const neck = data.neckTypes.find(n => n.id === config.neck);
  if (neck) total += neck.price || 0;
  const size = data.sizes[config.size];
  if (size) total += size.price || 0;
  const len = data.lengths.find(l => l.m === config.length);
  if (len) total += len.price || 0;

  const cover = data.covers.find(c => c.id === config.cover);
  if (cover) {
    const meters = getCoverMeters();
    const pricePerMeter = cover.pricePerMeter || cover.price || 0;
    total += pricePerMeter * meters;
  }

  const leather = data.leathers.find(l => l.id === config.leather);
  if (leather) total += leather.price || 0;
  const machine = data.machines.find(m => m.id === config.machine);
  if (machine) total += machine.price || 0;
  return total;
}

function generateCode() {
  const size = config.size || '';
  const neck = data.neckTypes.find(n => n.id === config.neck);
  const neckCode = neck?.code || '';
  const cover = data.covers.find(c => c.id === config.cover);
  const coverCode = cover?.code || '';
  const leather = data.leathers.find(l => l.id === config.leather);
  const leatherCode = leather?.code || '';
  const machine = data.machines.find(m => m.id === config.machine);
  const machineCode = machine?.code || '';
  const leatherPart = config.leather === 'brak' ? 'bez skory' : `Skora ${config.leatherColor || ''} ${leatherCode}`.trim();
  return `${size}${neckCode}_${coverCode}_${config.length || ''}M_${leatherPart}_${config.coverColor || ''}_${machineCode}`.replace(/_+/g, '_').replace(/^_|_$/g, '');
}

function renderSummary(content) {
  const price = calculatePrice();
  const code = generateCode();
  const coverMeters = getCoverMeters();
  const cooling = data.coolingTypes.find(c => c.id === config.cooling)?.name || '';
  const neck = data.neckTypes.find(n => n.id === config.neck)?.name || '';
  const size = data.sizes[config.size]?.name || config.size;
  const cover = data.covers.find(c => c.id === config.cover)?.name || '';
  const leather = data.leathers.find(l => l.id === config.leather)?.name || '';
  const machine = data.machines.find(m => m.id === config.machine)?.name || '';

  const coverObj = data.covers.find(c => c.id === config.cover);
  const coverPriceInfo = coverObj
    ? ` (${coverMeters} m × ${coverObj.pricePerMeter || coverObj.price || 0} ${data.currency}/m)`
    : '';

  content.innerHTML = `
    <h2>Podsumowanie zamówienia</h2>
    <div class="summary">
      <div class="row"><span>Typ:</span><span>${cooling}</span></div>
      <div class="row"><span>Fajka:</span><span>${neck}</span></div>
      <div class="row"><span>Rozmiar:</span><span>${size}</span></div>
      <div class="row"><span>Długość:</span><span>${config.length} m</span></div>
      <div class="row"><span>Osłona:</span><span>${cover} (${config.coverColor})${coverPriceInfo}</span></div>
      <div class="row"><span>Skóra:</span><span>${leather}${config.leatherColor ? ' ' + config.leatherColor : ''}</span></div>
      <div class="row"><span>Maszyna:</span><span>${machine}</span></div>
      <div class="total">Cena: ${price} ${data.currency}</div>
    </div>
    <div class="product-code">${code}</div>

    <div style="margin-top:20px">
      <label style="display:block;margin-bottom:6px;font-weight:600">Klient (imię / firma)</label>
      <input type="text" id="customerName" placeholder="np. Jan Kowalski / Firma XYZ" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:12px;font-size:1rem">

      <label style="display:block;margin-bottom:6px;font-weight:600">Telefon</label>
      <input type="tel" id="customerPhone" placeholder="np. 500 600 700" style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:12px;font-size:1rem">

      <label style="display:block;margin-bottom:6px;font-weight:600">Uwagi do zamówienia</label>
      <textarea id="orderNotes" rows="3" placeholder="Dodatkowe informacje, wymagania, termin itp." style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:16px;font-size:1rem;resize:vertical"></textarea>
    </div>

    <div class="nav" style="margin-top:8px">
      <button class="success" onclick="addToOrders('todo')">Dodaj do realizacji</button>
      <button class="secondary" onclick="addToOrders('waiting')">Dodaj w oczekiwaniu</button>
    </div>
    <p style="color:var(--muted);font-size:0.9rem;margin-top:12px">Ten kod można wydrukować lub skopiować na stanowisko produkcyjne.</p>
  `;
}

function addToOrders(status = 'todo') {
  const customerName = document.getElementById('customerName')?.value.trim() || '';
  const customerPhone = document.getElementById('customerPhone')?.value.trim() || '';
  const notes = document.getElementById('orderNotes')?.value.trim() || '';

  const order = {
    id: Date.now(),
    date: new Date().toLocaleString('pl-PL'),
    config: { ...config },
    code: generateCode(),
    price: calculatePrice(),
    customerName,
    customerPhone,
    notes,
    status
  };
  orders.unshift(order);
  localStorage.setItem('weldingOrders', JSON.stringify(orders));
  updateOrdersCount();
  saveToCloud();

  const statusText = status === 'todo' ? 'do realizacji' : 'w oczekiwaniu';
  alert(`Dodano ${statusText}!\n\nKod: ${order.code}`);

  config = {};
  currentStep = 0;
  renderProgress();
  renderStep();
  showOrders(status);
}

function setOrderStatus(id, newStatus) {
  const order = orders.find(o => o.id === id);
  if (order) {
    order.status = newStatus;
    localStorage.setItem('weldingOrders', JSON.stringify(orders));
    updateOrdersCount();
    renderOrders();
    saveToCloud();
  }
}

function renderOrders() {
  const el = document.getElementById('ordersList');
  const filtered = orders.filter(o => o.status === currentOrdersView);

  if (filtered.length === 0) {
    el.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">Brak pozycji w tej zakładce</p>';
    return;
  }

  el.innerHTML = filtered.map(o => {
    let actions = '';
    if (currentOrdersView === 'todo') {
      actions = `
        <button class="success" style="padding:6px 12px;font-size:0.85rem;flex:none;margin-right:6px" onclick="setOrderStatus(${o.id}, 'done')">Zrealizowano</button>
        <button class="secondary" style="padding:6px 12px;font-size:0.85rem;flex:none" onclick="setOrderStatus(${o.id}, 'waiting')">Przenieś do oczekujących</button>
      `;
    } else if (currentOrdersView === 'waiting') {
      actions = `
        <button class="success" style="padding:6px 12px;font-size:0.85rem;flex:none;margin-right:6px" onclick="setOrderStatus(${o.id}, 'todo')">Do realizacji</button>
        <button class="secondary" style="padding:6px 12px;font-size:0.85rem;flex:none" onclick="setOrderStatus(${o.id}, 'done')">Zrealizowano</button>
      `;
    } else {
      actions = `<button class="secondary" style="padding:6px 12px;font-size:0.85rem;flex:none" onclick="setOrderStatus(${o.id}, 'todo')">Przywróć do realizacji</button>`;
    }

    return `
      <div class="order">
        <div class="code">${o.code}</div>
        <div style="margin:6px 0;font-size:0.95rem">
          <strong>${o.customerName || '—'}</strong>
          ${o.customerPhone ? ` · ${o.customerPhone}` : ''}
        </div>
        ${o.notes ? `<div style="color:var(--muted);font-size:0.9rem;margin-bottom:6px;white-space:pre-wrap">${o.notes}</div>` : ''}
        <div class="meta">${o.date} · ${o.price} ${data.currency}</div>
        <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px">${actions}
          <button class="danger" style="padding:6px 12px;font-size:0.85rem;flex:none" onclick="removeOrder(${o.id})">Usuń</button>
        </div>
      </div>
    `;
  }).join('');
}

function clearCurrentOrders() {
  const viewName = { todo: 'do realizacji', waiting: 'w oczekiwaniu', done: 'zrealizowane' }[currentOrdersView];
  if (confirm(`Na pewno wyczyścić listę „${viewName}”?`)) {
    orders = orders.filter(o => o.status !== currentOrdersView);
    localStorage.setItem('weldingOrders', JSON.stringify(orders));
    updateOrdersCount();
    renderOrders();
    saveToCloud();
  }
}

function loadDataFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      data = loaded;
      localStorage.setItem('weldingData', JSON.stringify(data));
      alert('Baza danych wczytana pomyślnie!');
      currentStep = 0;
      config = {};
      renderProgress();
      renderStep();
    } catch (err) {
      alert('Błąd wczytywania pliku JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data-uchwyty.json';
  a.click();
}

function exportOrders() {
  if (orders.length === 0) {
    alert('Brak zamówień do eksportu.');
    return;
  }
  const blob = new Blob([JSON.stringify(orders, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zamowienia-uchwyty.json';
  a.click();
}

function importOrdersFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      if (!Array.isArray(loaded)) throw new Error('Plik nie zawiera listy zamówień');
      if (confirm(`Wczytać ${loaded.length} zamówień? Zastąpi to aktualną listę na tym urządzeniu.`)) {
        orders = loaded.map(o => ({ ...o, status: o.status || 'todo' }));
        localStorage.setItem('weldingOrders', JSON.stringify(orders));
        updateOrdersCount();
        renderOrders();
        alert('Zamówienia wczytane pomyślnie!');
      }
    } catch (err) {
      alert('Błąd wczytywania zamówień: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

init();
</script>
</body>
</html>
