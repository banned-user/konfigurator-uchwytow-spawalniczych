<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Konfigurator Uchwyty Spawalnicze</title>
<style>
:root {
  --bg: #0f1419;
  --card: #1a2332;
  --accent: #ff6b00;
  --accent2: #00c2a8;
  --text: #e8eef5;
  --muted: #8b9bb4;
  --border: #2a3a50;
  --success: #22c55e;
  --danger: #ef4444;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  line-height: 1.4;
}
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.6rem; margin-bottom: 4px; color: var(--accent); }
.subtitle { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
.progress { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.progress .step {
  flex: 1; min-width: 60px; text-align: center; padding: 6px 4px;
  background: var(--card); border-radius: 6px; font-size: 0.75rem; color: var(--muted);
  border: 1px solid var(--border);
}
.progress .step.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }
.progress .step.done { background: #1e3a2f; color: var(--success); }
.card {
  background: var(--card);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  margin-bottom: 16px;
}
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.option {
  background: #111820;
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 70px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.option:hover { border-color: var(--accent2); }
.option.selected { border-color: var(--accent); background: #2a1a10; }
.option .name { font-weight: 600; font-size: 1.05rem; }
.option .price { color: var(--accent2); font-size: 0.85rem; margin-top: 4px; }
.option .desc { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
.nav { display: flex; gap: 12px; margin-top: 20px; }
button {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 14px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  flex: 1;
}
button.secondary { background: #2a3a50; color: var(--text); }
button.success { background: var(--success); color: #000; }
button.danger { background: var(--danger); color: #fff; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.summary { font-size: 1.05rem; }
.summary .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.summary .total { font-size: 1.4rem; font-weight: 700; color: var(--accent); margin-top: 12px; }
.product-code {
  background: #000;
  color: var(--accent2);
  font-family: ui-monospace, Consolas, monospace;
  font-size: 1.15rem;
  padding: 16px;
  border-radius: 8px;
  margin: 16px 0;
  word-break: break-all;
  border: 1px dashed var(--accent2);
}
.orders-list .order {
  background: #111820;
  border-left: 4px solid var(--accent);
  padding: 12px 16px;
  margin-bottom: 10px;
  border-radius: 0 8px 8px 0;
}
.orders-list .order .code { font-family: ui-monospace, monospace; color: var(--accent2); font-size: 1.1rem; }
.orders-list .order .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar button { flex: none; padding: 10px 16px; font-size: 0.9rem; }
.hidden { display: none !important; }
#app { display: none; }
#app.active { display: block; }
.header-actions { display: flex; gap: 8px; margin-bottom: 12px; }
@media (max-width: 600px) {
  .options { grid-template-columns: 1fr 1fr; }
  h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div id="passwordGate" style="position:fixed;inset:0;background:#0f1419;display:flex;align-items:center;justify-content:center;z-index:9999">
  <div style="background:#1a2332;padding:28px;border-radius:12px;border:1px solid #2a3a50;width:100%;max-width:360px;text-align:center">
    <h2 style="margin-bottom:8px;color:#ff6b00">Konfigurator</h2>
    <p style="color:#8b9bb4;margin-bottom:16px;font-size:0.95rem">Wpisz hasło, aby kontynuować</p>
    <input type="password" id="pwInput" placeholder="Hasło" style="width:100%;padding:12px;border-radius:8px;border:1px solid #2a3a50;background:#111820;color:#e8eef5;margin-bottom:12px;font-size:1rem" onkeydown="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()" style="width:100%;padding:12px;background:#ff6b00;color:#000;border:none;border-radius:8px;font-weight:600;font-size:1rem;cursor:pointer">Wejdź</button>
    <p id="pwError" style="color:#ef4444;margin-top:10px;font-size:0.9rem;display:none">Nieprawidłowe hasło</p>
  </div>
</div>
<div class="container" id="mainApp" style="display:none">
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;justify-content:space-between">
    <div style="display:flex;gap:8px;align-items:center">
      <button class="secondary" style="flex:none;padding:8px 14px;font-size:0.9rem" onclick="loadFromCloud()">Odśwież zamówienia</button>
      <span id="syncStatus" style="font-size:0.85rem;color:var(--accent2)"></span>
    </div>
    <span id="dataInfo" style="font-size:0.8rem;color:var(--muted);font-family:monospace"></span>
  </div>

  <div class="header-actions">
    <button class="secondary" onclick="showSection('config')">Konfigurator</button>
    <button class="secondary" onclick="showOrders('waiting')">W oczekiwaniu (<span id="countWaiting">0</span>)</button>
    <button class="secondary" onclick="showOrders('todo')">Do realizacji (<span id="countTodo">0</span>)</button>
    <button class="secondary" onclick="showOrders('done')">Zrealizowane (<span id="countDone">0</span>)</button>
    <button class="secondary" onclick="showOrders('archived')">Archiwalne (<span id="countArchived">0</span>)</button>
    <button class="secondary" id="btnSettings" onclick="toggleSettings()">Ustawienia</button>
  </div>

  <div id="settingsPanel" style="display:none;margin-bottom:12px;padding:12px;background:#1a2332;border-radius:8px;border:1px solid var(--border)">
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="secondary" onclick="loadDataFromGitHub()">Odśwież bazę z GitHuba</button>
      <span id="dataStatus" style="font-size:0.85rem;color:var(--accent2)"></span>
    </div>
  </div>

  <div id="section-config" class="section">
    <h1>Konfigurator uchwytów spawalniczych</h1>
    <p class="subtitle">Wybierz krok po kroku – gotowy kod do realizacji na końcu</p>
    <div class="progress" id="progress"></div>
    <div class="card" id="stepContent"></div>
    <div class="nav">
      <button class="secondary" id="btnBack" onclick="prevStep()" disabled>Wstecz</button>
      <button id="btnNext" onclick="nextStep()" disabled>Dalej</button>
    </div>
  </div>

  <div id="section-orders" class="section hidden">
    <h1 id="ordersTitle">Do realizacji</h1>
    <p class="subtitle" id="ordersSubtitle">Gotowe konfiguracje</p>
    <div class="toolbar">
      <button class="danger" onclick="clearCurrentOrders()">Wyczyść bieżącą listę</button>
    </div>
    <div id="ordersList" class="orders-list"></div>
  </div>
</div>

<script>
const PAGE_PASSWORD = 'custom'; // ← zmień na swoje hasło

function checkPassword() {
  const input = document.getElementById('pwInput').value;
  if (input === PAGE_PASSWORD) {
    sessionStorage.setItem('auth', '1');
    localStorage.removeItem('weldingData');
    document.getElementById('passwordGate').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    if (typeof init === 'function') init();
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

// Auto-login if already authenticated in this session
if (sessionStorage.getItem('auth') === '1') {
  document.getElementById('passwordGate').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  if (typeof init === 'function') init();
}

const STEPS = [
  { id: 'cooling', title: 'Typ uchwytu' },
  { id: 'grip', title: 'Rękojeść' },
  { id: 'neckFamily', title: 'Rodzina fajki' },
  { id: 'size', title: 'Rozmiar SR' },
  { id: 'neck', title: 'Fajka Flex/Sztywna' },
  { id: 'neckColor', title: 'Kolor fajki' },
  { id: 'length', title: 'Długość' },
  { id: 'cover', title: 'Osłona' },
  { id: 'coverVariant', title: 'Wariant osłony' },
  { id: 'leather', title: 'Skóra' },
  { id: 'leatherColor', title: 'Kolor skóry' },
  { id: 'machine', title: 'Maszyna' },
  { id: 'summary', title: 'Podsumowanie' }
];

let data = null;
let currentStep = 0;
let config = {};
let orders = JSON.parse(localStorage.getItem('weldingOrders') || '[]');
let currentOrdersView = 'todo';
let syncUrl = localStorage.getItem('weldingSyncUrl') || 'https://script.google.com/macros/s/AKfycby5KfeInHypM_hxvyYizFtrclqzuZUHPdol-HnHiaspaVu6Osd5sKJt1PAA96bAx8kY/exec';
let autoRefreshTimer = null;
let knownOrderIds = new Set();

function playNotificationSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 880;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}

function showBrowserNotification(title, body) {
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;

    // Na mobile i w niektórych przeglądarkach konstruktor Notification jest zablokowany
    // Próbujemy bezpiecznie, a w razie błędu po prostu ignorujemy
    const n = new Notification(title, {
      body,
      icon: 'https://cdn-icons-png.flaticon.com/512/2910/2910768.png',
      silent: false
    });

    // Automatycznie zamykaj po kilku sekundach
    setTimeout(() => n.close(), 6000);
  } catch (err) {
    console.warn('Powiadomienie nie zostało wyświetlone:', err.message);
    // Na telefonie powiadomienia systemowe często nie działają bez Service Workera
    // Dźwięk i tak się odtworzy (playNotificationSound)
  }
}

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function startAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  if (syncUrl) {
    autoRefreshTimer = setInterval(() => {
      loadFromCloud();
    }, 1 * 60 * 1000); // co 1 minutę
  }
}

function saveSyncUrl() {
  // URL jest teraz stały – funkcja zostawiona dla kompatybilności
  document.getElementById('syncStatus').textContent = 'URL zapisany';
  startAutoRefresh();
  if (syncUrl) loadFromCloud();
}

async function loadFromCloud() {
  if (!syncUrl) {
    document.getElementById('syncStatus').textContent = 'Brak URL synchronizacji';
    return;
  }
  document.getElementById('syncStatus').textContent = 'Ładowanie...';
  try {
    const res = await fetch(syncUrl + (syncUrl.includes('?') ? '&' : '?') + '_=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const loaded = await res.json();
    if (Array.isArray(loaded)) {
      const newIds = loaded.map(o => o.id);
      const fresh = loaded.filter(o => !knownOrderIds.has(o.id) && o.status === 'todo');
      if (fresh.length > 0 && knownOrderIds.size > 0) {
        playNotificationSound();
        showBrowserNotification(
          'Nowe zamówienie' + (fresh.length > 1 ? ' (' + fresh.length + ')' : ''),
          fresh[0].code + (fresh[0].customerName ? ' – ' + fresh[0].customerName : '')
        );
      }
      knownOrderIds = new Set(newIds);
      orders = loaded;
      localStorage.setItem('weldingOrders', JSON.stringify(orders));
      updateOrdersCount();
      if (!document.getElementById('section-orders').classList.contains('hidden')) renderOrders();
      document.getElementById('syncStatus').textContent = 'Zsynchronizowano (' + orders.length + ')';
    } else {
      throw new Error('Niepoprawny format danych');
    }
  } catch (err) {
    document.getElementById('syncStatus').textContent = 'Błąd odczytu: ' + err.message;
    console.error(err);
  }
}

async function saveToCloud() {
  if (!syncUrl) return;
  document.getElementById('syncStatus').textContent = 'Zapisywanie...';
  try {
    await fetch(syncUrl, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(orders)
    });
    document.getElementById('syncStatus').textContent = 'Zapisano w chmurze';
  } catch (err) {
    document.getElementById('syncStatus').textContent = 'Błąd zapisu: ' + err.message;
    console.error(err);
  }
}

const DEFAULT_DATA = {
  "basePrice": 150,
  "currency": "zł",
  "coolingTypes": [
    { "id": "gazowy", "name": "Gazowy (powietrzny)", "description": "Chłodzenie gazem", "sizes": ["SR9", "SR17", "SR26"] },

  ],
  "grips": [

  ],

  ],
  "neckTypes": [
    { "id": "flex", "name": "Flex", "price": 25, "code": "Flex" },
    { "id": "sztywny", "name": "Sztywny", "price": 0, "code": "" }
  ],
  "sizes": {

    "SR17": { "name": "SR 17", "price": 110, "amperage": "do ~140A" },
    "SR26": { "name": "SR 26", "price": 140, "amperage": "do ~180A" },

  },
  "lengths": [

    { "m": 10, "price": 105 }, { "m": 12, "price": 125 }, { "m": 14, "price": 145 }, { "m": 16, "price": 165 }
  ],
  "covers": [
    { "id": "guma", "name": "Guma", "hasColors": false, "variants": [
      { "id": "std", "name": "Standard", "pricePerMeter": 4.5 },
      { "id": "swiss", "name": "Swiss", "pricePerMeter": 50 }
    ] },
    { "id": "tekstyl", "name": "Tekstyl", "hasColors": true, "pricePerMeter": 2.8, "colors": ["szary", "czarny", "granatowy", "czerwony", "pomarańczowy"] }
  ],
  "leathers": [
    { "id": "natural", "name": "Naturalna", "price": 55, "colors": ["czarna", "czerwona"] },
    { "id": "syntetyk", "name": "Syntetyczna", "price": 32, "colors": ["czarna", "czerwona", "zielona", "fioletowa", "niebieska", "żółta", "pomarańczowa", "szara"] },
    { "id": "brak", "name": "Bez skóry", "price": 0, "colors": [] }
  ],
  "machines": [
    { "id": "kemppi7pin", "name": "Kemppi 7pin", "price": 38, "code": "kemppi 7pin" },
    { "id": "kemppi5pin", "name": "Kemppi 5pin", "price": 38, "code": "kemppi 5pin" },
    { "id": "fronius", "name": "Fronius", "price": 45, "code": "fronius" },
    { "id": "esab", "name": "ESAB", "price": 40, "code": "esab" },
    { "id": "lincoln", "name": "Lincoln", "price": 40, "code": "lincoln" },
    { "id": "migatronic", "name": "Migatronic", "price": 42, "code": "migatronic" },
    { "id": "ewm", "name": "EWM", "price": 40, "code": "ewm" },
    { "id": "uniwersalna", "name": "Uniwersalna / inna", "price": 25, "code": "uniwersalna" }
  ]
};

function removeOrder(id) {
  orders = orders.filter(o => o.id !== id);
  localStorage.setItem('weldingOrders', JSON.stringify(orders));
  updateOrdersCount();
  renderOrders();
  saveToCloud();
}

function init() {
  localStorage.removeItem('weldingData');
  data = DEFAULT_DATA;
  orders.forEach(o => {
    if (!o.status) o.status = 'todo';
  });
  if (syncUrl) {
    requestNotificationPermission();
    loadFromCloud();
  }
  startAutoRefresh();
  updateOrdersCount();
  renderProgress();
  renderStep();
  document.getElementById('section-config').classList.add('active');
  loadDataFromGitHub();
}

async function loadDataFromGitHub() {
  const statusEl = document.getElementById('dataStatus');
  const infoEl = document.getElementById('dataInfo');
  if (statusEl) statusEl.textContent = 'Ładowanie bazy...';
  if (infoEl) infoEl.textContent = 'data_ładowanie...';

  // GitHub API – zawsze aktualna wersja (bez cache CDN)
  const apiUrl = 'https://api.github.com/repos/banned-user/konfigurator-uchwytow-spawalniczych/contents/data.json?t=' + Date.now();

  try {
    const res = await fetch(apiUrl, {
      cache: 'no-store',
      headers: { 'Accept': 'application/vnd.github.raw' }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const loaded = await res.json();
    if (!loaded || !loaded.grips || !loaded.neckFamilies) {
      throw new Error('Niepoprawny format bazy');
    }
    data = loaded;
    const stamp = new Date().toISOString().replace('T', '_').slice(0, 16);
    if (infoEl) infoEl.textContent = 'data_' + stamp;
    if (statusEl) statusEl.textContent = 'Baza OK';
    if (typeof renderStep === 'function') renderStep();
    return true;
  } catch (err) {
    if (statusEl) statusEl.textContent = 'Błąd bazy: ' + err.message;
    if (infoEl) infoEl.textContent = 'data_błąd';
    console.error(err);
    return false;
  }
}

function showSection(name) {
  document.querySelectorAll('.section').forEach(s => s.classList.add('hidden'));
  document.getElementById('section-' + name).classList.remove('hidden');
  if (name === 'orders') renderOrders();
}

function showOrders(view) {
  currentOrdersView = view;
  showSection('orders');
  const titles = {
    todo: 'Do realizacji',
    waiting: 'W oczekiwaniu',
    done: 'Zrealizowane',
    archived: 'Archiwalne'
  };
  const subtitles = {
    todo: 'Gotowe do produkcji',
    waiting: 'Oczekujące na potwierdzenie / materiały',
    done: 'Zrealizowane zamówienia',
    archived: 'Archiwum – szukaj po kliencie'
  };
  document.getElementById('ordersTitle').textContent = titles[view] || 'Zamówienia';
  document.getElementById('ordersSubtitle').textContent = subtitles[view] || '';
  renderOrders();
}

function updateOrdersCount() {
  const todo = orders.filter(o => o.status === 'todo').length;
  const waiting = orders.filter(o => o.status === 'waiting').length;
  const done = orders.filter(o => o.status === 'done').length;
  const archived = orders.filter(o => o.status === 'archived').length;
  document.getElementById('countTodo').textContent = todo;
  document.getElementById('countWaiting').textContent = waiting;
  document.getElementById('countDone').textContent = done;
  const el = document.getElementById('countArchived');
  if (el) el.textContent = archived;
}

function renderProgress() {
  const el = document.getElementById('progress');
  el.innerHTML = STEPS.map((s, i) =>
    `<div class="step ${i === currentStep ? 'active' : ''} ${i < currentStep ? 'done' : ''}" onclick="jumpToStep(${i})" style="cursor:pointer">${s.title}</div>`
  ).join('');
}

function jumpToStep(index) {
  if (index >= 0 && index < STEPS.length) {
    currentStep = index;
    renderProgress();
    renderStep(true);
  }
}

function renderStep(forceShow) {
  if (!data || !data.grips || !data.neckFamilies) {
    data = DEFAULT_DATA;
  }
  const step = STEPS[currentStep];
  const content = document.getElementById('stepContent');
  const btnNext = document.getElementById('btnNext');
  const btnBack = document.getElementById('btnBack');
  btnBack.disabled = currentStep === 0;
  btnNext.disabled = !isStepComplete();
  btnNext.textContent = currentStep === STEPS.length - 1 ? 'Podsumowanie' : 'Dalej';
  if (currentStep === STEPS.length - 1) {
    btnNext.style.display = 'none';
  } else {
    btnNext.style.display = '';
  }

  if (step.id === 'summary') {
    renderSummary(content);
    return;
  }

  // Skip steps that don't apply (only when not forced)
  if (!forceShow) {
    if (step.id === 'neckColor') {
      const fam = data.neckFamilies?.find(f => f.id === config.neckFamily);
      if (!fam?.hasColor) { nextStep(); return; }
    }
    if (step.id === 'coverVariant') {
      const cover = data.covers?.find(c => c.id === config.cover);
      if (!cover || (!cover.variants && !cover.colors)) { nextStep(); return; }
    }
    if (step.id === 'leatherColor' && config.leather === 'brak') {
      config.leatherColor = '';
      nextStep();
      return;
    }
  }

  let html = `<h2 style="margin-bottom:16px">${step.title}</h2>`;
  html += '<div class="options">';

  if (step.id === 'cooling') {
    data.coolingTypes.forEach(t => {
      html += optionHTML(t.id, t.name, t.description || '', config.cooling === t.id);
    });
  } else if (step.id === 'grip') {
    data.grips.forEach(g => {
      // Wodny bez Cybergrip
      if (config.cooling === 'wodny' && g.id === 'cybergrip') return;
      html += optionHTML(g.id, g.name, g.price ? `+${g.price} ${data.currency}` : '', config.grip === g.id);
    });
  } else if (step.id === 'neckFamily') {
    data.neckFamilies.forEach(f => {
      html += optionHTML(f.id, f.name, '', config.neckFamily === f.id);
    });
  } else if (step.id === 'size') {
    let allowed = data.neckFamilies.find(f => f.id === config.neckFamily)?.sizes || [];
    // Wodny: tylko SR18 i SR20 (odpadają 9, 17, 26)
    if (config.cooling === 'wodny') {
      allowed = allowed.filter(s => s === 'SR18' || s === 'SR20');
    }
    // Cybergrip ogranicza do SR9 i SR17 (tylko gazowy)
    if (config.grip === 'cybergrip') {
      allowed = allowed.filter(s => s === 'SR9' || s === 'SR17');
    }
    if (allowed.length === 0) {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Brak dostępnych rozmiarów dla tej kombinacji</p>';
    }
    allowed.forEach(sid => {
      const s = data.sizes[sid];
      if (s) html += optionHTML(sid, s.name, `${s.amperage || ''} · +${s.price} ${data.currency}`, config.size === sid);
    });
  } else if (step.id === 'neck') {
    data.neckTypes.forEach(t => {
      html += optionHTML(t.id, t.name, t.price ? `+${t.price} ${data.currency}` : '', config.neck === t.id);
    });
  } else if (step.id === 'neckColor') {
    const colors = data.neckFamilies.find(f => f.id === config.neckFamily)?.colors || [];
    if (colors.length === 0) {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Ta rodzina fajki nie ma kolorów</p>';
    }
    colors.forEach(col => {
      html += optionHTML(col, col.charAt(0).toUpperCase() + col.slice(1), '', config.neckColor === col);
    });
  } else if (step.id === 'length') {
    data.lengths.forEach(l => {
      html += optionHTML(l.m, `${l.m} m`, `+${l.price} ${data.currency}`, config.length === l.m);
    });
  } else if (step.id === 'cover') {
    data.covers.forEach(c => {
      html += optionHTML(c.id, c.name, '', config.cover === c.id);
    });
  } else if (step.id === 'coverVariant') {
    const cover = data.covers.find(c => c.id === config.cover);
    if (!cover) {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Najpierw wybierz osłonę</p>';
    } else if (cover.variants) {
      cover.variants.forEach(v => {
        html += optionHTML(v.id, v.name, `${v.pricePerMeter} ${data.currency}/m`, config.coverVariant === v.id);
      });
    } else if (cover.colors) {
      cover.colors.forEach(col => {
        html += optionHTML(col, col.charAt(0).toUpperCase() + col.slice(1), '', config.coverVariant === col);
      });
    } else {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Ta osłona nie ma wariantów</p>';
    }
  } else if (step.id === 'leather') {
    data.leathers.forEach(l => {
      html += optionHTML(l.id, l.name, l.price ? `+${l.price} ${data.currency}` : '', config.leather === l.id);
    });
  } else if (step.id === 'leatherColor') {
    const leather = data.leathers.find(l => l.id === config.leather);
    const colors = leather?.colors || [];
    if (colors.length === 0) {
      html += '<p style="grid-column:1/-1;text-align:center;color:var(--muted)">Brak kolorów dla wybranej skóry</p>';
    }
    colors.forEach(col => {
      html += optionHTML(col, col.charAt(0).toUpperCase() + col.slice(1), '', config.leatherColor === col);
    });
  } else if (step.id === 'machine') {
    data.machines.forEach(m => {
      html += optionHTML(m.id, m.name, `+${m.price} ${data.currency}`, config.machine === m.id);
    });
  }

  html += '</div>';
  content.innerHTML = html;

  content.querySelectorAll('.option').forEach(el => {
    el.onclick = () => selectOption(step.id, el.dataset.id);
  });
}

function optionHTML(id, name, price, selected) {
  return `<div class="option ${selected ? 'selected' : ''}" data-id="${id}"><div class="name">${name}</div>${price ? `<div class="price">${price}</div>` : ''}</div>`;
}

function selectOption(stepId, value) {
  if (stepId === 'length') value = Number(value);
  config[stepId] = value;
  if (stepId === 'cooling') {
    delete config.size;
    // Wodny nie ma Cybergrip
    if (value === 'wodny' && config.grip === 'cybergrip') {
      delete config.grip;
    }
  }
  if (stepId === 'grip' || stepId === 'neckFamily') {
    delete config.size;
    if (stepId === 'neckFamily') delete config.neckColor;
  }
  if (stepId === 'cover') delete config.coverVariant;
  if (stepId === 'leather' && value === 'brak') config.leatherColor = '';
  renderStep();
}

function isStepComplete() {
  const step = STEPS[currentStep];
  if (!data) return false;
  if (step.id === 'neckColor') {
    const fam = data.neckFamilies?.find(f => f.id === config.neckFamily);
    if (!fam?.hasColor) return true;
  }
  if (step.id === 'coverVariant') {
    const cover = data.covers?.find(c => c.id === config.cover);
    if (!cover || (!cover.variants && !cover.colors)) return true;
  }
  if (step.id === 'leatherColor' && config.leather === 'brak') return true;
  return config[step.id] !== undefined && config[step.id] !== null && config[step.id] !== '';
}

function nextStep() {
  if (currentStep < STEPS.length - 1) {
    currentStep++;
    renderProgress();
    renderStep();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderProgress();
    renderStep();
  }
}

function getCoverMeters() {
  const length = config.length || 0;
  if (config.leather && config.leather !== 'brak') {
    return Math.max(0, length - 1);
  }
  return length;
}

function calculatePrice() {
  let total = data.basePrice || 0;
  const size = data.sizes[config.size];
  if (size) total += size.price || 0;
  const grip = data.grips.find(g => g.id === config.grip);
  if (grip) total += grip.price || 0;
  const neck = data.neckTypes.find(n => n.id === config.neck);
  if (neck) total += neck.price || 0;
  const lengthObj = data.lengths.find(l => l.m === config.length);
  if (lengthObj) total += lengthObj.price || 0;

  const cover = data.covers.find(c => c.id === config.cover);
  if (cover) {
    const meters = getCoverMeters();
    let ppm = 0;
    if (cover.variants) {
      const v = cover.variants.find(x => x.id === config.coverVariant);
      ppm = v?.pricePerMeter || 0;
    } else {
      ppm = cover.pricePerMeter || 0;
    }
    total += meters * ppm;
  }

  const leather = data.leathers.find(l => l.id === config.leather);
  if (leather) total += leather.price || 0;
  const machine = data.machines.find(m => m.id === config.machine);
  if (machine) total += machine.price || 0;
  return Math.round(total);
}

function generateCode() {
  const size = config.size || '';
  const neckFam = data.neckFamilies.find(f => f.id === config.neckFamily);
  const neckFamCode = neckFam ? neckFam.name.replace(/\s+/g, '') : '';
  const neck = data.neckTypes.find(n => n.id === config.neck);
  const neckCode = neck && neck.code ? neck.code : '';
  const grip = data.grips.find(g => g.id === config.grip);
  const gripCode = grip ? grip.name.replace(/\s+/g, '') : '';
  const length = config.length ? config.length + 'M' : '';
  const cover = data.covers.find(c => c.id === config.cover);
  const coverCode = cover ? cover.id : '';
  const leather = data.leathers.find(l => l.id === config.leather);
  const leatherCode = leather && leather.id !== 'brak' ? leather.id : '';
  const machine = data.machines.find(m => m.id === config.machine);
  const machineCode = machine ? machine.code : '';

  let parts = [size];
  if (gripCode) parts.push(gripCode);
  if (neckFamCode) parts.push(neckFamCode);
  if (neckCode) parts.push(neckCode);
  if (config.neckColor) parts.push(config.neckColor);
  if (length) parts.push(length);
  if (coverCode) parts.push(coverCode);
  if (config.coverVariant) parts.push(config.coverVariant);
  if (leatherCode) parts.push('Skora ' + (config.leatherColor || '') + ' ' + leatherCode);
  if (machineCode) parts.push(machineCode);

  return parts.filter(Boolean).join('_').replace(/\s+/g, ' ').trim();
}

function renderSummary(content) {
  const price = calculatePrice();
  const code = generateCode();

  let html = '<h2 style="margin-bottom:16px">Podsumowanie</h2>';
  html += '<div class="summary">';
  html += row('Typ', data.coolingTypes.find(c => c.id === config.cooling)?.name || '-');
  html += row('Rękojeść', data.grips.find(g => g.id === config.grip)?.name || '-');
  html += row('Rodzina fajki', data.neckFamilies.find(f => f.id === config.neckFamily)?.name || '-');
  html += row('Rozmiar', data.sizes[config.size]?.name || '-');
  html += row('Fajka', data.neckTypes.find(n => n.id === config.neck)?.name || '-');
  if (config.neckColor) html += row('Kolor fajki', config.neckColor);
  html += row('Długość', (config.length || '-') + ' m');
  const cover = data.covers.find(c => c.id === config.cover);
  html += row('Osłona', cover?.name || '-');
  if (config.coverVariant) html += row('Wariant osłony', config.coverVariant);
  html += row('Skóra', data.leathers.find(l => l.id === config.leather)?.name || '-');
  if (config.leather !== 'brak' && config.leatherColor) html += row('Kolor skóry', config.leatherColor);
  html += row('Maszyna', data.machines.find(m => m.id === config.machine)?.name || '-');
  html += '</div>';
  html += '<div class="product-code" id="productCode">' + code + '</div>';
  html += '<div class="total">Cena: ' + price + ' ' + (data.currency || 'zł') + '</div>';
  html += '<div style="margin-top:20px">';
  html += '<label style="display:block;margin-bottom:6px;color:var(--muted)">Nazwa własna (opcjonalnie)</label>';
  html += '<input type="text" id="customName" placeholder="np. Uchwyt do Kemppi" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:12px">';
  html += '<label style="display:block;margin-bottom:6px;color:var(--muted)">Nazwa klienta</label>';
  html += '<input type="text" id="customerName" placeholder="Imię i nazwisko / firma" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:12px">';
  html += '<label style="display:block;margin-bottom:6px;color:var(--muted)">Telefon</label>';
  html += '<input type="text" id="customerPhone" placeholder="Nr telefonu" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);margin-bottom:12px">';
  html += '<label style="display:block;margin-bottom:6px;color:var(--muted)">Uwagi</label>';
  html += '<textarea id="orderNotes" rows="3" placeholder="Dodatkowe uwagi do zamówienia" style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text);resize:vertical"></textarea>';
  html += '</div>';
  html += '<div class="nav" style="margin-top:20px">';
  html += '<button class="success" onclick="saveOrder(\'todo\')">Do realizacji</button>';
  html += '<button class="secondary" onclick="saveOrder(\'waiting\')">W oczekiwaniu</button>';
  html += '</div>';

  content.innerHTML = html;

  // Pre-fill when editing
  if (window.editingOrderId) {
    const order = orders.find(o => o.id === window.editingOrderId);
    if (order) {
      const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
      set('customName', order.customName);
      set('customerName', order.customerName);
      set('customerPhone', order.customerPhone);
      set('orderNotes', order.notes);
    }
  }
}

function row(label, value) {
  return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
}

function saveOrder(status) {
  const customerName = document.getElementById('customerName')?.value || '';
  const customerPhone = document.getElementById('customerPhone')?.value || '';
  const notes = document.getElementById('orderNotes')?.value || '';
  const customName = document.getElementById('customName')?.value || '';

  if (window.editingOrderId) {
    const order = orders.find(o => o.id === window.editingOrderId);
    if (order) {
      order.code = generateCode();
      order.price = calculatePrice();
      order.status = status;
      order.customerName = customerName;
      order.customerPhone = customerPhone;
      order.notes = notes;
      order.customName = customName;
      order.config = { ...config };
      order.date = new Date().toISOString();
    }
    delete window.editingOrderId;
    alert('Zamówienie zaktualizowane!');
  } else {
    const order = {
      id: Date.now(),
      code: generateCode(),
      price: calculatePrice(),
      status: status,
      customerName,
      customerPhone,
      notes,
      customName,
      config: { ...config },
      date: new Date().toISOString()
    };
    orders.push(order);
    alert('Zamówienie zapisane!');
  }

  localStorage.setItem('weldingOrders', JSON.stringify(orders));
  updateOrdersCount();
  saveToCloud();
  currentStep = 0;
  config = {};
  renderProgress();
  renderStep();
  showOrders(status);
}

function renderOrders() {
  const list = document.getElementById('ordersList');
  let filtered = orders.filter(o => o.status === currentOrdersView);

  let searchHtml = '';
  if (currentOrdersView === 'archived') {
    searchHtml = `<div style="margin-bottom:12px"><input type="text" id="archiveSearch" placeholder="Szukaj po kliencie, telefonie, nazwie..." style="width:100%;padding:10px;border-radius:6px;border:1px solid var(--border);background:#111820;color:var(--text)" oninput="renderOrders()"></div>`;
    const q = (document.getElementById('archiveSearch')?.value || '').toLowerCase().trim();
    if (q) {
      filtered = filtered.filter(o =>
        (o.customerName || '').toLowerCase().includes(q) ||
        (o.customerPhone || '').toLowerCase().includes(q) ||
        (o.customName || '').toLowerCase().includes(q) ||
        (o.code || '').toLowerCase().includes(q) ||
        (o.notes || '').toLowerCase().includes(q)
      );
    }
  }

  if (filtered.length === 0) {
    list.innerHTML = searchHtml + '<p style="color:var(--muted);text-align:center;padding:40px 0">Brak zamówień w tej kategorii</p>';
    return;
  }

  list.innerHTML = searchHtml + filtered.map(o => {
    let actions = '';
    if (currentOrdersView === 'todo') {
      actions = `<button class="success" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'done')">Zrealizowano</button>
                 <button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'waiting')">Przenieś do oczekujących</button>`;
    } else if (currentOrdersView === 'waiting') {
      actions = `<button class="success" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'todo')">Do realizacji</button>
                 <button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'done')">Zrealizowano</button>`;
    } else if (currentOrdersView === 'done') {
      actions = `<button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'archived')">Archiwizuj</button>
                 <button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'todo')">Przywróć</button>`;
    } else if (currentOrdersView === 'archived') {
      actions = `<button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="changeStatus(${o.id}, 'done')">Przywróć</button>`;
    }
    const detailsId = 'details-' + o.id;
    return `<div class="order">
      <div class="code">${o.code}</div>
      ${o.customName ? `<div style="margin-top:2px;font-weight:600">${o.customName}</div>` : ''}
      ${o.customerName ? `<div style="margin-top:4px">${o.customerName}${o.customerPhone ? ' · ' + o.customerPhone : ''}</div>` : ''}
      ${o.notes ? `<div style="margin-top:4px;color:var(--muted);font-size:0.9rem">${o.notes}</div>` : ''}
      <div class="meta">${o.date} · ${o.price} zł</div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="toggleDetails('${detailsId}')">Podgląd</button>
        <button class="secondary" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="editOrder(${o.id})">Edytuj</button>
        ${actions}
        <button class="danger" style="flex:none;padding:8px 12px;font-size:0.85rem" onclick="removeOrder(${o.id})">Usuń</button>
      </div>
      <div id="${detailsId}" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
        ${renderOrderDetails(o)}
      </div>
    </div>`;
  }).join('');
}

function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function renderOrderDetails(o) {
  const c = o.config || {};
  const cooling = data.coolingTypes.find(x => x.id === c.cooling)?.name || '-';
  const grip = data.grips.find(x => x.id === c.grip)?.name || '-';
  const neck = data.neckTypes.find(x => x.id === c.neck)?.name || '-';
  const size = data.sizes[c.size]?.name || c.size || '-';
  const cover = data.covers.find(x => x.id === c.cover)?.name || '-';
  const leather = data.leathers.find(x => x.id === c.leather)?.name || '-';
  const machine = data.machines.find(x => x.id === c.machine)?.name || '-';
  return `
    <div class="summary" style="font-size:0.95rem">
      <div class="row"><span>Typ</span><span>${cooling}</span></div>
      <div class="row"><span>Rękojeść</span><span>${grip}</span></div>
      <div class="row"><span>Fajka</span><span>${neck}</span></div>
      <div class="row"><span>Rozmiar</span><span>${size}</span></div>
      <div class="row"><span>Długość</span><span>${c.length || '-'} m</span></div>
      <div class="row"><span>Osłona</span><span>${cover} (${c.coverColor || '-'})</span></div>
      <div class="row"><span>Skóra</span><span>${leather}${c.leather !== 'brak' && c.leatherColor ? ' (' + c.leatherColor + ')' : ''}</span></div>
      <div class="row"><span>Maszyna</span><span>${machine}</span></div>
      <div class="row"><span>Cena</span><span>${o.price} zł</span></div>
    </div>
  `;
}

function editOrder(id) {
  const order = orders.find(o => o.id === id);
  if (!order) return;
  config = JSON.parse(JSON.stringify(order.config || {}));
  // Przejdź do konfiguratora z wczytanymi danymi
  currentStep = 0;
  showSection('config');
  renderProgress();
  renderStep(true);
  // Zapamiętaj ID edytowanego zamówienia, żeby przy zapisie nadpisać
  window.editingOrderId = id;
  alert('Edytujesz zamówienie. Po zmianach zapisz je ponownie z podsumowania.');
}

function changeStatus(id, newStatus) {
  const order = orders.find(o => o.id === id);
  if (order) {
    order.status = newStatus;
    localStorage.setItem('weldingOrders', JSON.stringify(orders));
    updateOrdersCount();
    renderOrders();
    saveToCloud();
  }
}

function clearCurrentOrders() {
  const viewName = { todo: 'do realizacji', waiting: 'w oczekiwaniu', done: 'zrealizowane', archived: 'archiwalne' }[currentOrdersView];
  if (confirm(`Na pewno wyczyścić listę „${viewName}”?`)) {
    orders = orders.filter(o => o.status !== currentOrdersView);
    localStorage.setItem('weldingOrders', JSON.stringify(orders));
    updateOrdersCount();
    renderOrders();
    saveToCloud();
  }
}

function loadDataFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      data = loaded;
      localStorage.setItem('weldingData', JSON.stringify(data));
      alert('Baza danych wczytana pomyślnie!');
      currentStep = 0;
      config = {};
      renderProgress();
      renderStep();
    } catch (err) {
      alert('Błąd wczytywania pliku JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function loadDataFromCSV(input) {
  alert('Import CSV jest w przygotowaniu. Na razie użyj pliku JSON.');
  input.value = '';
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data-uchwyty.json';
  a.click();
}

function exportOrders() {
  if (orders.length === 0) {
    alert('Brak zamówień do eksportu.');
    return;
  }
  const blob = new Blob([JSON.stringify(orders, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'zamowienia-uchwyty.json';
  a.click();
}

function importOrdersFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const loaded = JSON.parse(e.target.result);
      if (!Array.isArray(loaded)) throw new Error('Plik nie zawiera listy zamówień');
      if (confirm(`Wczytać ${loaded.length} zamówień? Zastąpi to aktualną listę na tym urządzeniu.`)) {
        orders = loaded.map(o => ({ ...o, status: o.status || 'todo' }));
        localStorage.setItem('weldingOrders', JSON.stringify(orders));
        updateOrdersCount();
        renderOrders();
        alert('Zamówienia wczytane pomyślnie!');
      }
    } catch (err) {
      alert('Błąd wczytywania zamówień: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  if (panel) {
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }
}

function resetDataCache() {
  if (confirm("Przywrócić domyślną bazę danych? (usunie lokalne zmiany)")) {
    localStorage.removeItem("weldingData");
    data = DEFAULT_DATA;
    currentStep = 0;
    config = {};
    renderProgress();
    renderStep();
    alert("Baza przywrócona do domyślnej.");
  }
}

if (sessionStorage.getItem('auth') === '1') {
  init();
}
</script>
</body>
